<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wombat</title>

<!--
  A chat client for the wombat HTTP API. One file, no dependencies, readable
  over pretty.

  Three things it has to get right, and they are the three the previous
  one-shot page got wrong:

  1. The composer stays usable after the first answer. A session owns a
     CONVERSATION, so the first turn is POST /api/sessions and every turn after
     it is POST /api/sessions/{id}/messages.

  2. ONE EventSource per session, opened once and left open across turn
     boundaries. Sequence numbers are global to the session, so a reconnect
     resumes into the same numbering — and the browser does that itself, from
     Last-Event-ID, with no help from here.

  3. A reload recovers. The session id lives in location.hash and the whole
     event log is replayed from sequence 0, so the transcript is rebuilt from
     the server rather than from memory this page no longer has.
-->

<style>
  :root {
    color-scheme: light dark;
    --line: color-mix(in oklab, currentColor 15%, transparent);
    --dim: color-mix(in oklab, currentColor 55%, transparent);
    --bad: #c0392b;
    --warn: #d68910;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.55 ui-sans-serif, system-ui, sans-serif;
    margin: 0; height: 100dvh; display: grid;
    grid-template-columns: 15rem 1fr;
  }
  button, input, textarea { font: inherit; color: inherit; background: transparent; }
  button {
    border: 1px solid var(--line); border-radius: 6px; padding: .4rem .8rem; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }

  /* sidebar */
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: .8rem; display: flex; gap: .5rem; align-items: center; }
  aside h1 { font-size: 1rem; margin: 0; flex: 1; }
  #sessions { overflow-y: auto; flex: 1; padding: 0 .5rem .5rem; }
  .item {
    display: block; width: 100%; text-align: left; border: 1px solid transparent;
    border-radius: 6px; padding: .45rem .55rem; margin-bottom: .2rem;
  }
  .item:hover { border-color: var(--line); }
  .item[aria-current="true"] { border-color: var(--line); background: color-mix(in oklab, currentColor 7%, transparent); }
  .item .name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { display: block; font-size: .8em; color: var(--dim); }
  aside footer { padding: .6rem .8rem; border-top: 1px solid var(--line); font-size: .78em; color: var(--dim); }

  /* main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #log { overflow-y: auto; flex: 1; padding: 1.2rem; }
  #log > * { max-width: 48rem; margin-inline: auto; }
  #composer { border-top: 1px solid var(--line); padding: .7rem 1.2rem 1rem; }
  #composer form { max-width: 48rem; margin-inline: auto; display: flex; gap: .5rem; align-items: flex-end; }
  #prompt {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 8px;
    padding: .55rem .7rem; max-height: 9rem;
  }
  #status { max-width: 48rem; margin: 0 auto .4rem; font-size: .8em; color: var(--dim); display: flex; gap: .6rem; }
  #status .off { color: var(--bad); }

  /* transcript */
  .turn { border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 1rem; }
  .turn:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .you { font-weight: 600; white-space: pre-wrap; margin-bottom: .6rem; }
  .answer { white-space: pre-wrap; }
  .foot { color: var(--dim); font-size: .82em; margin-top: .6rem; }
  .err { color: var(--bad); white-space: pre-wrap; }
  details.reasoning { margin: .5rem 0; font-size: .9em; color: var(--dim); }
  details.reasoning pre { white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: .7rem; margin: .3rem 0 0; }
  .tool { border: 1px solid var(--line); border-radius: 6px; padding: .4rem .7rem; margin: .5rem 0; font-size: .9em; }
  .tool[data-ok="false"] { border-color: var(--bad); }
  .tool summary { cursor: pointer; }
  .tool pre { white-space: pre-wrap; word-break: break-word; margin: .4rem 0 0; color: var(--dim); }
  .sub-agent { margin-left: 1.2rem; border-left: 2px solid var(--line); padding-left: .8rem; }
  .approval { border: 1px solid var(--warn); border-radius: 6px; padding: .6rem .8rem; margin: .6rem 0; font-size: .9em; }
  .approval[data-settled] { border-color: var(--line); opacity: .7; }
  .approval pre { white-space: pre-wrap; word-break: break-word; margin: .4rem 0; color: var(--dim); }
  .approval .row { display: flex; gap: .5rem; align-items: center; }
  .approval .row button { padding: .25rem .7rem; }
  .verdict { color: var(--dim); }
  .spin::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
</style>

<aside>
  <header>
    <h1>wombat</h1>
    <button id="new" type="button" title="start a new conversation">New</button>
  </header>
  <div id="sessions"></div>
  <footer id="caps">…</footer>
</aside>

<main>
  <div id="log"></div>
  <div id="composer">
    <div id="status"><span id="link">idle</span><span id="seq"></span><span id="spend"></span></div>
    <form id="ask">
      <textarea id="prompt" rows="1" placeholder="Ask something…  (Enter to send, Shift+Enter for a newline)" autofocus></textarea>
      <button id="send">Send</button>
      <button id="stop" type="button" disabled title="cancel the turn and drop this conversation">Stop</button>
    </form>
  </div>
</main>

<script>
"use strict";

// ===== tiny helpers =====

const byId = (id) => document.getElementById(id);
const log = byId("log");

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function el(tag, cls, parent) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  (parent || log).appendChild(n);
  return n;
}

function atBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
}

// Named keepAtBottom and not scroll, and openSession and not open, because a
// top-level `function scroll` in a classic script REPLACES window.scroll — the
// obvious names here are the ones the platform already owns.
function keepAtBottom(wasAtBottom) {
  if (wasAtBottom) log.scrollTop = log.scrollHeight;
}

// api wraps fetch with this server's error envelope, so every call site can
// just catch. The envelope's `kind` is preserved on the Error because a UI
// branches on it — 409 busy is not the same as 404 gone.
async function api(method, path, body) {
  const init = { method };
  if (body !== undefined) {
    init.headers = { "Content-Type": "application/json" };
    init.body = JSON.stringify(body);
  }
  const r = await fetch(path, init);
  if (r.status === 204) return null;
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) {
    const detail = (data && data.error) || { kind: "http_" + r.status, message: text };
    throw Object.assign(new Error(detail.message || r.statusText), {
      kind: detail.kind,
      status: r.status,
    });
  }
  return data;
}

// ===== page state =====
//
// Everything here is per SESSION and is thrown away only when the session
// changes, never when a turn ends. That is what makes the composer usable
// again and the stream survive a turn boundary.

let stream = null;      // the EventSource, one per session
let current = null;     // session id
let lastSeq = -1;       // highest sequence rendered, for the seq readout
let running = false;    // a turn is in flight
let finished = false;   // the model ended the conversation with a terminal tool
let openTurn = 1;       // the turn the frames without one belong to

const turns = new Map();      // turn number -> { box, body, foot, answer, reasoning }
const tools = new Map();      // tool_use id -> card
const streaming = new Map();  // tool-call index -> card, before its id is known
const approvals = new Map();  // tool_use id -> approval card
const subagents = new Map();  // sub-agent name -> nested container

// Every frame kind the server can send. Named SSE events mean one listener
// each; the list is generated into web/events.ts by cmd/wombat-tsgen, and a
// kind missing from here is a kind this page silently ignores.
const KINDS = [
  "turn_started", "turn_ended",
  "iter_start", "llm_start", "llm_done",
  "text_delta", "reasoning_delta", "tool_args_delta",
  "tool_start", "tool_done",
  "permission_requested", "permission_decided",
  "subagent_start", "subagent_event", "subagent_end",
  "spend",
];

function resetView() {
  log.textContent = "";
  turns.clear(); tools.clear(); streaming.clear(); approvals.clear(); subagents.clear();
  lastSeq = -1;
  openTurn = 1;
  running = false;
  finished = false;
  byId("spend").textContent = "";
  setStatus("idle");
}

function setStatus(text, off) {
  byId("link").textContent = text;
  byId("link").classList.toggle("off", !!off);
  byId("seq").textContent = lastSeq >= 0 ? "seq " + lastSeq : "";
  byId("stop").disabled = !running;
  // Done is the one state a prompt cannot follow: POST .../messages answers
  // 409 done, and offering a button whose only outcome is an error is worse
  // than not offering it.
  byId("send").disabled = running || finished;
  byId("prompt").disabled = finished;
}

// ===== rendering =====

// turnBox is the container every event of a turn renders into. Created on
// demand, because a client that resumes mid-turn never saw its turn_started.
function turnBox(n) {
  let t = turns.get(n);
  if (t) return t;
  const box = el("section", "turn");
  t = {
    box,
    you: el("div", "you", box),
    body: el("div", "body", box),
    foot: el("div", "foot", box),
    answer: null,
    reasoning: null,
  };
  turns.set(n, t);
  return t;
}

// scopeFor nests a sub-agent's events instead of interleaving them.
function scopeFor(turn, name) {
  if (!name) return turnBox(turn).body;
  const key = turn + "/" + name;
  if (!subagents.has(key)) subagents.set(key, el("div", "sub-agent", turnBox(turn).body));
  return subagents.get(key);
}

function toolCard(scope, name) {
  const card = el("details", "tool", scope);
  card.open = true;
  const sum = el("summary", null, card);
  sum.innerHTML = esc(name || "…") + ' <span class="spin"></span>';
  const args = el("pre", null, card);
  return { card, sum, args, name: name || "", text: "" };
}

// claim adopts the card a tool_args_delta started against a streaming index,
// once the completed call announces its tool_use id.
function claim(name, useID) {
  for (const [k, c] of streaming) {
    if (useID && c.useID === useID) { streaming.delete(k); return c; }
  }
  for (const [k, c] of streaming) {
    if (c.name === name) { streaming.delete(k); return c; }
  }
  return null;
}

// approvalCard is keyed by tool_use id and built at most once.
//
// That is what makes it survive a reload. The whole log is replayed, so a
// request whose card is already on screen arrives again; returning the
// existing card keeps one card per question. And because the call is still
// parked in the dispatcher on the server, a replayed card is still answerable
// — the buttons are not decoration on a historical record.
function approvalCard(d, scope) {
  let c = approvals.get(d.use_id);
  if (c) return c;

  const box = el("div", "approval", scope);
  box.innerHTML =
    "<div><b>" + esc(d.tool) + "</b> needs your approval</div>" +
    (d.reason ? '<div class="verdict">' + esc(d.reason) + "</div>" : "") +
    "<pre></pre>" +
    '<div class="row">' +
      '<button type="button" data-allow="true">Allow</button>' +
      '<button type="button" data-allow="false">Deny</button>' +
      '<span class="verdict"></span>' +
    "</div>";
  box.querySelector("pre").textContent =
    d.input === undefined ? "(no arguments)" : JSON.stringify(d.input, null, 2);

  c = {
    box,
    buttons: [...box.querySelectorAll("button")],
    verdict: box.querySelector(".row .verdict"),
    settled: false,
  };
  for (const b of c.buttons) {
    b.onclick = () => resolveApproval(d.use_id, b.dataset.allow === "true", c);
  }
  approvals.set(d.use_id, c);
  return c;
}

function settleApproval(c, text) {
  c.settled = true;
  c.box.dataset.settled = "true";
  for (const b of c.buttons) b.disabled = true;
  c.verdict.textContent = text;
}

// resolveApproval answers a parked call. The stream cannot carry it — SSE is
// one-way — so the verdict goes back over plain HTTP, in a body rather than a
// query string so it cannot be delivered by a link someone was tricked into.
async function resolveApproval(useID, allow, c) {
  for (const b of c.buttons) b.disabled = true;
  c.verdict.textContent = allow ? "allowing…" : "denying…";
  try {
    await api("POST", `/api/sessions/${encodeURIComponent(current)}/approvals/${encodeURIComponent(useID)}`,
      { allow });
  } catch (e) {
    c.verdict.textContent = e.message;
    // Gone or already settled: no amount of clicking changes that. Anything
    // else — a dropped connection, a 503 — is worth another try.
    if (e.kind !== "no_such_approval" && e.kind !== "already_answered" && !c.settled) {
      for (const b of c.buttons) b.disabled = false;
    }
  }
}

function spendLine(s) {
  if (!s) return "";
  return [
    "$" + s.cost_usd.toFixed(4),
    s.input_tokens + " in",
    s.output_tokens + " out",
    s.calls + (s.calls === 1 ? " call" : " calls"),
    s.elapsed_sec.toFixed(1) + "s",
  ].join(" · ");
}

// render is the whole renderer: one event, one turn, one optional sub-agent
// scope. Sub-agent frames re-enter it with their inner event.
function render(kind, d, turn, scopeName) {
  const t = turnBox(turn);
  const scope = scopeFor(turn, scopeName);

  switch (kind) {
    case "turn_started":
      t.you.textContent = d.prompt;
      break;

    case "turn_ended": {
      // The turn's own footer: what it produced and what it cost. The session
      // total lives in the status bar.
      if (d.outcome === "paused" && d.question) {
        el("div", "foot", t.box).textContent = "waiting on you: " + d.question;
      }
      if (d.outcome === "submitted") {
        // The payload IS the answer for a terminal tool, and it is the one
        // thing the conversation was for.
        el("div", "foot", t.box).textContent = "submitted via " + d.tool;
        if (d.answer) el("pre", "answer", t.box).textContent = d.answer;
      }
      if (d.error) {
        el("div", "err", t.box).textContent = (d.error_kind || "error") + ": " + d.error;
      }
      t.foot.textContent = spendLine(d.spend);
      for (const [, c] of approvals) {
        if (!c.settled) settleApproval(c, "the turn ended before this was answered");
      }
      break;
    }

    case "text_delta":
      if (!t.answer) t.answer = el("div", "answer spin", scope);
      t.answer.textContent += d.text;
      break;

    case "reasoning_delta":
      // Collapsed by default: it is the model's private deliberation, it is
      // often most of the tokens, and it is not the answer.
      if (!t.reasoning) {
        const box = el("details", "reasoning", scope);
        el("summary", null, box).textContent = "reasoning";
        t.reasoning = el("pre", null, box);
      }
      t.reasoning.textContent += d.text;
      break;

    case "llm_start":
      // Streaming indices are per model call; nothing still unadopted can
      // belong to the next one.
      streaming.clear();
      break;

    case "tool_args_delta": {
      let c = streaming.get(d.index);
      if (!c) { c = toolCard(scope, d.name); streaming.set(d.index, c); }
      if (d.name && !c.name) {
        c.name = d.name;
        c.sum.innerHTML = esc(d.name) + ' <span class="spin"></span>';
      }
      if (d.use_id) c.useID = d.use_id;
      c.text += d.text;
      c.args.textContent = c.text;
      break;
    }

    case "tool_start": {
      const c = claim(d.name, d.use_id) || toolCard(scope, d.name);
      c.name = d.name;
      c.sum.innerHTML = esc(d.name) + ' <span class="spin"></span>';
      c.args.textContent = d.input === undefined ? "" : JSON.stringify(d.input);
      tools.set(d.use_id, c);
      break;
    }

    case "tool_done": {
      const c = tools.get(d.use_id);
      if (!c) break;
      c.card.dataset.ok = d.ok;
      c.card.open = false;
      c.sum.innerHTML = esc(d.name) + ' <span class="verdict">' + d.ms + "ms</span>";
      el("pre", null, c.card).textContent = d.ok ? (d.output || "(no output)") : d.error;
      break;
    }

    case "permission_requested":
      approvalCard(d, scope);
      break;

    case "permission_decided": {
      // Every gated call is decided, but only the ones that had to ask have a
      // card; a rule that allowed something outright has nothing to update.
      const c = approvals.get(d.use_id);
      if (c) settleApproval(c, (d.allowed ? "allowed" : "denied") + (d.source ? " · " + d.source : ""));
      break;
    }

    case "subagent_start":
      el("div", "foot", scopeFor(turn, d.name)).textContent = "↳ " + d.name + ": " + d.task;
      break;

    case "subagent_event":
      render(d.inner.type, d.inner, turn, d.name);
      break;

    case "spend":
      byId("spend").textContent = spendLine(d);
      break;

    default:
      break; // iter_start, llm_done, subagent_end: nothing to draw
  }
}

// ===== the stream =====

// attach opens the session's one EventSource.
//
// from is only used for the deliberate reattach after switching sessions; the
// browser's own reconnects carry Last-Event-ID and need no help. The
// connection is NOT closed at the end of a turn: it is the conversation's
// stream, and the next turn writes into the same sequence space.
function attach(id, from) {
  detach();
  let url = `/api/sessions/${encodeURIComponent(id)}/events`;
  if (from > 0) url += "?from=" + from;
  const es = new EventSource(url);
  stream = es;

  let first = true;
  es.onopen = () => setStatus("connected");
  es.onerror = () => {
    // Do NOT close. The turn is still going on the server and EventSource is
    // about to reconnect and resume from exactly where this connection
    // stopped.
    if (stream === es) setStatus("reconnecting…", true);
  };

  const on = (kind, fn) => es.addEventListener(kind, (m) => {
    if (stream !== es) return;             // a stale socket from a session we left
    const bottom = atBottom();
    if (m.lastEventId) {
      const seq = Number(m.lastEventId);
      // The one way eviction is observable: the first frame is not the one
      // asked for. Say so, rather than drawing a transcript that starts in the
      // middle and looks complete.
      if (first && from === 0 && seq > 0) {
        el("div", "foot").textContent = `(the first ${seq} events have been evicted)`;
      }
      first = false;
      lastSeq = seq;
    }
    try { fn(JSON.parse(m.data)); } catch (e) { console.error(kind, e); }
    setStatus(running ? "streaming" : "connected");
    keepAtBottom(bottom);
  });

  for (const kind of KINDS) {
    on(kind, (d) => {
      if (kind === "turn_started") running = true;
      if (kind === "turn_ended") { running = false; refreshSessions(); }
      // Only turn_started and turn_ended carry a turn number; everything
      // between them belongs to the turn last opened.
      if (typeof d.turn === "number") openTurn = d.turn;
      render(kind, d, openTurn, null);
    });
  }

  // The terminal frame. A finished conversation would otherwise leave
  // EventSource in a reconnect loop: attach, resume past the end, close, back
  // off, repeat.
  on("end", (info) => {
    running = false;
    finished = info.state === "done";
    detach();
    document.querySelectorAll(".spin").forEach((n) => n.classList.remove("spin"));
    setStatus(info.state);
    refreshSessions();
  });
}

function detach() {
  if (stream) { stream.close(); stream = null; }
}

// ===== sessions =====

async function refreshSessions() {
  let list;
  try {
    list = (await api("GET", "/api/sessions")).sessions || [];
  } catch {
    return; // the sidebar is a convenience; a failed poll is not worth a banner
  }
  const box = byId("sessions");
  box.textContent = "";
  for (const s of list) {
    const b = el("button", "item", box);
    b.type = "button";
    b.setAttribute("aria-current", String(s.id === current));
    el("span", "name", b).textContent = s.title || firstLine(s.answer) || s.id.slice(0, 8);
    el("span", "sub", b).textContent =
      `${s.state} · ${s.turns} turn${s.turns === 1 ? "" : "s"} · $${s.spend.cost_usd.toFixed(4)}`;
    b.onclick = () => openSession(s.id);
  }
}

function firstLine(s) {
  if (!s) return "";
  const line = s.split("\n", 1)[0];
  return line.length > 40 ? line.slice(0, 40) + "…" : line;
}

// open switches to a session and rebuilds its transcript by replaying the
// whole log. Replaying rather than reading GET /messages: the log has the
// prompts, the tool cards and the unanswered approvals, and the transcript has
// only what the model saw.
async function openSession(id) {
  if (id === current && stream) return;
  detach();
  resetView();
  current = id;
  location.hash = id;

  let info;
  try {
    info = await api("GET", "/api/sessions/" + encodeURIComponent(id));
  } catch (e) {
    current = null;
    location.hash = "";
    el("div", "err").textContent = e.message;
    refreshSessions();
    return;
  }

  running = info.state === "running" || info.state === "approving";
  finished = info.state === "done";
  byId("spend").textContent = spendLine(info.spend);

  // Replayed from sequence 0. A session whose ring has overflowed cannot be
  // replayed in full, and that is visible: the first frame's id is greater
  // than 0, which attach() reports rather than quietly rendering a transcript
  // with a hole in it.
  attach(id, 0);
  refreshSessions();
}

// ===== composing =====

async function submit(prompt) {
  const bottom = atBottom();
  running = true;
  setStatus("sending…");
  try {
    if (!current) {
      const info = await api("POST", "/api/sessions", { prompt, title: firstLine(prompt) });
      current = info.id;
      location.hash = info.id;
      attach(info.id, 0);
    } else {
      await api("POST", `/api/sessions/${encodeURIComponent(current)}/messages`, { prompt });
      // The stream is already open and will carry the new turn; nothing to
      // reattach, which is the entire point of a session-wide log.
    }
    refreshSessions();
  } catch (e) {
    running = false;
    el("div", "err").textContent = e.message;
    setStatus("idle");
  }
  keepAtBottom(bottom);
}

const promptBox = byId("prompt");

promptBox.addEventListener("input", () => {
  promptBox.style.height = "auto";
  promptBox.style.height = promptBox.scrollHeight + "px";
});

promptBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    byId("ask").requestSubmit();
  }
});

byId("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const prompt = promptBox.value.trim();
  if (!prompt || running || finished) return;
  promptBox.value = "";
  promptBox.style.height = "auto";
  submit(prompt);
});

// Stop is a DELETE, because disconnecting cancels nothing — that is what a
// session outliving its connection means, and cancellation had to become
// explicit somewhere.
byId("stop").addEventListener("click", async () => {
  if (!current) return;
  const id = current;
  detach();
  current = null;
  running = false;
  location.hash = "";
  try { await api("DELETE", "/api/sessions/" + encodeURIComponent(id)); } catch { /* already gone */ }
  setStatus("cancelled");
  refreshSessions();
});

byId("new").addEventListener("click", () => {
  detach();
  current = null;
  location.hash = "";
  resetView();
  refreshSessions();
  promptBox.focus();
});

addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && id !== current) openSession(id);
});

// ===== boot =====

(async function boot() {
  try {
    const caps = await api("GET", "/api/config");
    const n = (caps.tools || []).length;
    byId("caps").textContent =
      `${caps.version} · ${caps.default_model || "default model"} · ${n} tool${n === 1 ? "" : "s"}` +
      (caps.approvals ? " · approvals" : "");
  } catch {
    byId("caps").textContent = "config unavailable";
  }
  await refreshSessions();
  const id = location.hash.slice(1);
  if (id) openSession(id); else setStatus("idle");
})();
</script>
